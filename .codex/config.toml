# .codex/config.toml
[projects."/workspaces/mdsweep"]
trust_level = "trusted"

[mcp_servers.spartan-ui]
command = "/usr/local/share/nvm/current/bin/npx"
args = ["-y", "@spartan-ng/mcp"]

[mcp_servers.keycloak]
command = "uvx"
args = ["keycloak-mcp-server"]
required = true
startup_timeout_sec = 30

[mcp_servers.keycloak.env]
KEYCLOAK_URL = "http://localhost:8081"
KEYCLOAK_ADMIN_USERNAME = "admin"
KEYCLOAK_ADMIN_PASSWORD = "Development-only-password"
KEYCLOAK_ADMIN_REALM = "master"
KEYCLOAK_VERIFY_SSL = "false"
