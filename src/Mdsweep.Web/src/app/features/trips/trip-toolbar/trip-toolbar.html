<div class="space-y-4 pb-6">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight">Trips</h1>
    </div>

    <button hlmBtn class="inline-flex items-center gap-2 self-start" (click)="importTrips()">
      <ng-icon name="lucideUpload" class="size-4" aria-hidden="true" />
      <span>Import trips</span>
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <button hlmBtn variant="outline" class="inline-flex items-center gap-2" type="button">
        <ng-icon name="lucideCalendarDays" class="size-4" aria-hidden="true" />
        <span>{{ formattedDate() }}</span>
      </button>

      <button hlmBtn variant="outline" size="icon" type="button" (click)="previousDay()">
        <ng-icon name="lucideChevronLeft" class="size-4" aria-hidden="true" />
      </button>

      <button hlmBtn variant="outline" size="icon" type="button" (click)="nextDay()">
        <ng-icon name="lucideChevronRight" class="size-4" aria-hidden="true" />
      </button>

      <button hlmBtn variant="secondary" type="button" (click)="today()">Today</button>

      <button hlmBtn variant="outline" type="button" (click)="tomorrow()">Tomorrow</button>

      <button hlmBtn variant="outline" type="button" (click)="thisWeek()">This week</button>
    </div>

    <div class="relative max-w-xl">
      <ng-icon
        name="lucideSearch"
        class="text-muted-foreground pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2"
        aria-hidden="true"
      />

      <input
        hlmInput
        class="pl-9"
        type="text"
        [ngModel]="search()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Search by passenger, address, trip number, or driver..."
      />
    </div>
  </div>
</div>
