<div class="space-y-4 pb-6">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-3xl font-semibold tracking-tight">{{ 'trips.title' | translate }}</h1>

    <button
      hlmBtn
      type="button"
      class="inline-flex items-center gap-2"
      (click)="importTripsClicked.emit()"
    >
      <ng-icon name="lucideUpload" class="size-4" aria-hidden="true" />

      {{ 'trips.import' | translate }}
    </button>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <hlm-date-picker
      appLocalizedCalendar
      [date]="serviceDate()"
      [formatDate]="formatServiceDate()"
      captionLayout="dropdown"
      [autoCloseOnSelect]="true"
      (dateChange)="onServiceDateChange($event)"
    >
      <hlm-date-picker-trigger buttonId="service-date">
        {{ 'trips.selectDate' | translate }}
      </hlm-date-picker-trigger>
    </hlm-date-picker>

    <button
      hlmBtn
      variant="outline"
      size="icon"
      type="button"
      [attr.aria-label]="'trips.previousDay' | translate"
      (click)="previousDayClicked.emit()"
    >
      <ng-icon name="lucideChevronLeft" class="rtl:rotate-180 size-4" aria-hidden="true" />
    </button>

    <button
      hlmBtn
      variant="outline"
      size="icon"
      type="button"
      [attr.aria-label]="'trips.nextDay' | translate"
      (click)="nextDayClicked.emit()"
    >
      <ng-icon name="lucideChevronRight" class="rtl:rotate-180 size-4" aria-hidden="true" />
    </button>

    <button
      hlmBtn
      [variant]="isToday() ? 'secondary' : 'outline'"
      type="button"
      (click)="todayClicked.emit()"
    >
      {{ 'trips.today' | translate }}
    </button>

    <button
      hlmBtn
      [variant]="isTomorrow() ? 'secondary' : 'outline'"
      type="button"
      (click)="tomorrowClicked.emit()"
    >
      {{ 'trips.tomorrow' | translate }}
    </button>

    <button hlmBtn variant="outline" type="button" (click)="thisWeekClicked.emit()">
      {{ 'trips.thisWeek' | translate }}
    </button>
  </div>

  <div class="relative max-w-xl">
    <ng-icon
      name="lucideSearch"
      class="text-muted-foreground pointer-events-none absolute top-1/2 start-3 size-4 -translate-y-1/2"
      aria-hidden="true"
    />

    <input
      hlmInput
      type="search"
      [attr.aria-label]="'trips.search' | translate"
      class="w-full ps-9"
      [value]="search()"
      (input)="onSearchInput($event)"
      [placeholder]="'trips.search' | translate"
    />
  </div>
</div>
