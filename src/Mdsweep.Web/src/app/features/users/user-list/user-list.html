<div class="overflow-hidden rounded-lg border">
  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTHead class="bg-muted/40">
        <tr hlmTr>
          <th hlmTh scope="col" class="h-12 px-4">User</th>
          <th hlmTh scope="col" class="h-12 px-4">Roles</th>
          <th hlmTh scope="col" class="h-12 px-4">Status</th>
          <th hlmTh scope="col" class="h-12 w-12 px-4">
            <span class="sr-only">Open details</span>
          </th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (user of users(); track key(user)) {
          <tr
            hlmTr
            class="group cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-ring
              focus-visible:ring-inset"
            [attr.data-state]="key(user) === selectedUserKey() ? 'selected' : null"
            [attr.aria-selected]="key(user) === selectedUserKey()"
            tabindex="0"
            (click)="select(user)"
            (keydown.enter)="select(user)"
            (keydown.space)="$event.preventDefault(); select(user)"
          >
            <td hlmTd class="px-4 py-4">
              <div class="flex items-center gap-3">
                <span
                  class="bg-secondary text-secondary-foreground grid size-10 shrink-0
                    place-items-center rounded-full text-sm font-semibold"
                  aria-hidden="true"
                >
                  {{ initials(user) }}
                </span>
                <span class="min-w-0">
                  <span class="block truncate font-medium">{{ user.displayName }}</span>
                  <span class="text-muted-foreground block truncate text-sm">{{ user.email }}</span>
                </span>
              </div>
            </td>
            <td hlmTd class="px-4 py-4">
              <div class="flex flex-wrap gap-1.5">
                @for (role of user.roles; track role) {
                  <span hlmBadge variant="secondary">{{ role }}</span>
                }
              </div>
            </td>
            <td hlmTd class="px-4 py-4">
              <span
                hlmBadge
                [variant]="
                  user.status === 'Active'
                    ? 'secondary'
                    : user.status === 'Inactive'
                      ? 'destructive'
                      : 'outline'
                "
              >
                {{ statusLabel(user) }}
              </span>
            </td>
            <td hlmTd class="px-4 py-4 text-right">
              <ng-icon
                name="lucideChevronRight"
                class="text-muted-foreground size-5 group-hover:translate-x-0.5"
                aria-hidden="true"
              />
            </td>
          </tr>
        } @empty {
          <tr hlmTr>
            <td hlmTd colspan="4" class="py-10 whitespace-normal">
              <hlm-empty>
                <hlm-empty-header>
                  <h2 hlmEmptyTitle>No users match.</h2>
                  <p hlmEmptyDescription>Try a different name, email, or status.</p>
                </hlm-empty-header>
              </hlm-empty>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
