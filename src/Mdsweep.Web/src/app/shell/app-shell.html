<header class="bg-secondary px-4 py-8 text-secondary-foreground sm:px-8 lg:px-16">
  <span class="text-primary text-xs font-bold tracking-widest uppercase">
    {{ text.productContext }}
  </span>
  <h1 class="mt-1 text-3xl font-semibold">{{ text.pageTitle }}</h1>
</header>

<main class="mx-auto grid max-w-7xl gap-4 p-4 sm:p-6">
  @if (sessionQuery.isPending()) {
    <div class="text-muted-foreground flex items-center justify-center gap-2 py-16" role="status">
      <hlm-spinner /> Establishing your secure session
    </div>
  } @else if (sessionQuery.isError()) {
    @if (sessionError()) {
      <div hlmAlert variant="destructive">
        <h2 hlmAlertTitle>Provider selection required</h2>
        <p hlmAlertDescription>{{ sessionError() }}</p>
      </div>
    }
    <section hlmCard class="mx-auto mt-8 w-full max-w-md">
      <div hlmCardHeader>
        <h2 hlmCardTitle>{{ text.signInTitle }}</h2>
        <p hlmCardDescription>{{ text.signInHelp }}</p>
      </div>
      <div hlmCardFooter>
        <button hlmBtn type="button" (click)="signIn()">{{ text.signIn }}</button>
      </div>
    </section>
  } @else {
    <router-outlet />
  }
</main>
